<style>
:root{--dur:3.6s}
#pip *{transform-box:view-box}
.v{opacity:0} .v.on{opacity:1}
#pip,#pip-squash{transform-origin:200px 384px}
#shadow{transform-box:view-box;transform-origin:200px 392px}
#head{transform-origin:200px 238px} #antenna{transform-origin:200px 84px} #antenna-glow{transform-origin:200px 28px}
#arm-l{transform-origin:148px 252px} #arm-r{transform-origin:252px 252px}
#hand-l{transform-origin:148px 316px} #hand-r{transform-origin:252px 316px}
#eyes{transform-origin:200px 160px} #mouth{transform-origin:200px 196px} #torso{transform-origin:200px 338px}
#cheeks{opacity:0} #tear,#burst,.spark,#ha-l,#ha-r{opacity:0}
#gear{transform-origin:156px 82px} #wrench{transform-origin:246px 96px}
.spark{transform-box:fill-box;transform-origin:50% 50%}
#mouth-smile{opacity:1}
@keyframes t-head{0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(-2deg) translateY(1px)}}
#head{animation:t-head var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-eyes{0%,38%{transform:translate(6px,-9px) scaleY(1)} 44%{transform:translate(0px,-9px) scaleY(.1)} 50%,86%{transform:translate(-6px,-9px) scaleY(1)} 93%,100%{transform:translate(6px,-9px) scaleY(1)}}
#eyes{animation:t-eyes var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-m{0%,100%{transform:translateX(9px) scale(.55,.45)} 50%{transform:translateX(7px) scale(.6,.4)}}
#mouth{animation:t-m var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-ar{0%,100%{transform:rotate(134deg)} 20%{transform:rotate(130deg)} 26%{transform:rotate(136deg)} 32%{transform:rotate(131deg)} 38%{transform:rotate(134deg)}}
#arm-r{animation:t-ar var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-hr{0%,100%{transform:rotate(-20deg)} 50%{transform:rotate(-14deg)}}
#hand-r{animation:t-hr var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-al{0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(-18deg)}}
#arm-l{animation:t-al var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
#pip{animation:t-bob var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-breathe{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.012,1.025)}}
#torso{animation:t-breathe var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-gear{0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)}}
#gear{animation:t-gear var(--dur) linear 0s infinite}
@keyframes t-ant{0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(3deg)}}
#antenna{animation:t-ant var(--dur) cubic-bezier(.45,0,.55,1) -.6s infinite}
@keyframes t-glow{0%,100%{opacity:.15;transform:scale(.9)} 25%,75%{opacity:.6;transform:scale(1.3)} 50%{opacity:.2;transform:scale(1)}}
#antenna-glow{animation:t-glow var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-q{0%{opacity:0;transform:translateY(10px) scale(.4) rotate(-10deg)} 10%{opacity:1;transform:translateY(-4px) scale(1.1) rotate(6deg)} 16%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)} 55%{opacity:1;transform:translateY(-6px) scale(1) rotate(-5deg)} 88%{opacity:1;transform:translateY(0) scale(1) rotate(3deg)} 100%{opacity:0;transform:translateY(-12px) scale(.9) rotate(0deg)}}
#q{animation:t-q var(--dur) cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-tb0{0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1.15)}}
#tb0{animation:t-tb0 1.2s cubic-bezier(.45,0,.55,1) 0s infinite}
@keyframes t-tb1{0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1.15)}}
#tb1{animation:t-tb1 1.2s cubic-bezier(.45,0,.55,1) -.25s infinite}


@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
