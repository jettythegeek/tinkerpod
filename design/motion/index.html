<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pip · Motion test · TinkerPod</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F8FAFC;font-family:Nunito,system-ui,sans-serif;color:#0F172A}
header{max-width:1280px;margin:0 auto;padding:40px 32px 8px;display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap}
header img{height:48px}h1{margin:0;font-size:34px;font-weight:900}header p{margin:4px 0 0;color:#475569;font-weight:700}
.grid{max-width:1280px;margin:0 auto;padding:24px 32px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{margin:0;background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);overflow:hidden}
.art{background:radial-gradient(ellipse at 50% 55%,#E6FBF8,#F8FAFC 70%);aspect-ratio:1}.art img{width:100%;height:100%;display:block}
figcaption{padding:16px 20px 20px}.row{display:flex;justify-content:space-between;align-items:baseline}b{font-size:24px;font-weight:900}
.dur{font-size:13px;font-weight:800;color:#007A70;background:#E6FBF8;padding:3px 10px;border-radius:99px}
.use{font-weight:800;color:#7C3AED;font-size:14px;margin-top:4px}p{margin:6px 0 10px;color:#475569;font-weight:600;font-size:14px;line-height:1.45}
code{font-size:12px;color:#64748B}
.video{max-width:1280px;margin:0 auto;padding:0 32px 60px}.video video{width:min(540px,100%);aspect-ratio:1;background:#F8FAFC;border-radius:24px;display:block;box-shadow:0 8px 24px rgba(15,23,42,.08)}
h2{font-weight:900}
</style></head><body>
<header><div><h1>Meet Pip · motion test</h1><p>7 looping moods · vector SVG · named layers for react-native-svg / Lottie</p></div><img src="../assets/logo.png" alt="TinkerPod"></header>
<section class="grid"><figure class="card"><div class="art"><img src="svg/pip-idle.svg" alt="Pip Idle"></div>
<figcaption><div class="row"><b>Idle</b><span class="dur">3.2s loop</span></div><div class="use">Home screen · always alive</div><p>Breathing bob, head sway with lag, blink, antenna glow</p><code>svg/pip-idle.svg</code></figcaption></figure><figure class="card"><div class="art"><img src="svg/pip-wave.svg" alt="Pip Wave"></div>
<figcaption><div class="row"><b>Wave</b><span class="dur">2.8s loop</span></div><div class="use">Hello! · onboarding & greetings</div><p>Anticipation dip → overshoot raise → wrist-flick wave</p><code>svg/pip-wave.svg</code></figcaption></figure><figure class="card"><div class="art"><img src="svg/pip-happy.svg" alt="Pip Happy"></div>
<figcaption><div class="row"><b>Happy</b><span class="dur">2.6s loop</span></div><div class="use">Correct answer</div><p>Crouch → hop with stretch → landing squash, sparkles</p><code>svg/pip-happy.svg</code></figcaption></figure><figure class="card"><div class="art"><img src="svg/pip-sad.svg" alt="Pip Sad"></div>
<figcaption><div class="row"><b>Sad</b><span class="dur">4.4s loop</span></div><div class="use">Wrong answer · streak broken</div><p>Slow sigh, drooped antenna (light off), tear</p><code>svg/pip-sad.svg</code></figcaption></figure><figure class="card"><div class="art"><img src="svg/pip-laugh.svg" alt="Pip Laugh"></div>
<figcaption><div class="row"><b>Laugh</b><span class="dur">1.4s loop</span></div><div class="use">Fun moments · jokes</div><p>Double bounce, squint eyes, head shake, “ha” lines</p><code>svg/pip-laugh.svg</code></figcaption></figure><figure class="card"><div class="art"><img src="svg/pip-clap.svg" alt="Pip Clap"></div>
<figcaption><div class="row"><b>Clap</b><span class="dur">1.8s loop</span></div><div class="use">Lesson complete</div><p>Two claps with rebound + impact burst, nods</p><code>svg/pip-clap.svg</code></figcaption></figure><figure class="card"><div class="art"><img src="svg/pip-cheer.svg" alt="Pip Cheer"></div>
<figcaption><div class="row"><b>Cheer</b><span class="dur">3.2s loop</span></div><div class="use">Level up · tournament win</div><p>Crouch → big jump, arms up, star eyes, confetti</p><code>svg/pip-cheer.svg</code></figcaption></figure></section>
<section class="video"><h2>Reel (25.8s)</h2><video src="pip-motion-test.mp4" poster="poster.jpg" controls loop muted playsinline></video></section>
</body></html>
