<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tp.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="tp.js"></script>
</head>
<body><div class="capture" style="padding:30px">
<div class="phone theme-junior">
 <div class="screen">
  <img src="../assets/journey-map-bg.jpg" style="position:absolute;left:0;right:0;top:150px;width:100%;height:694px;object-fit:cover;object-position:center 70%">
  <!-- locked fog over the end of the level -->
  <div style="position:absolute;left:0;right:0;top:150px;height:260px;backdrop-filter:grayscale(.8) brightness(1.06);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);background:rgba(248,250,252,.22)"></div>
  <svg id="trail" style="position:absolute;inset:0" width="390" height="844"></svg>
  <!-- purple Learn header -->
  <div style="position:absolute;inset:0 0 auto 0;height:196px;background:radial-gradient(120% 90% at 85% 0%,#A78BFA 0%,#7C3AED 45%,#5B21B6 100%);border-radius:0 0 32px 32px;box-shadow:0 10px 24px -12px rgba(30,0,80,.5)"></div>
  <div data-statusbar="light"></div>
  <div style="position:relative;padding:2px 20px 0">
   <div class="flex items-center justify-between">
    <div class="text-white"><div class="over" style="color:#DDD6FE">Journey 1 · Explorer</div><div style="font-size:28px;font-weight:900;line-height:1.1">Learn</div></div>
    <span data-podchip="coding,design"></span>
   </div>
   <div class="seg3 mt-4"><span class="on"><i data-lucide="map"></i>Journey</span><span><i data-lucide="target"></i>Missions</span><span><i data-lucide="swords"></i>Compete</span></div>
  </div>
  <!-- level card -->
  <div class="card" style="position:absolute;left:16px;right:16px;top:208px;padding:10px 14px;border-radius:20px;z-index:8;display:flex;align-items:center;gap:12px">
   <div style="width:42px;height:42px;border-radius:14px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;box-shadow:0 3px 0 #5B21B6;flex:none">3</div>
   <div class="flex-1 min-w-0">
    <div class="flex justify-between items-baseline"><span style="font-weight:900;font-size:15px">Level 3 · Loops Valley</span><span style="font-size:12px;font-weight:900;color:var(--purple)">2/4 units</span></div>
    <div class="bar mt-1" style="height:8px"><i style="width:50%"></i></div>
    <div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-top:3px">Finish the level to unlock a mission</div>
   </div>
  </div>
  <div id="nodes"></div>
  <img src="../assets/mascot-happy.png" style="position:absolute;width:74px;left:300px;top:382px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35));z-index:6">
  <!-- continue card -->
  <div class="card" style="position:absolute;left:16px;right:16px;bottom:108px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;z-index:20">
   <div style="width:52px;height:52px;border-radius:18px;overflow:hidden;flex:none"><img src="../assets/lesson-loops.jpg" style="width:100%;height:100%;object-fit:cover;transform:scale(1.25)"></div>
   <div class="flex-1 min-w-0">
    <div class="over" style="color:var(--purple)">Unit 3 · Lesson 3 of 4</div>
    <div class="h3">Jollof Countdown</div>
    <div class="flex items-center gap-1.5 mt-0.5" style="font-size:12px;font-weight:800;color:var(--muted)"><i data-lucide="circle-help" style="width:14px;height:14px;color:#2563EB"></i>Quiz at the end · <span data-ic="xp" data-s="14"></span>+80</div>
   </div>
   <div class="btn sm" style="height:46px;padding:0 18px">Play</div>
  </div>
  <div data-kidnav="learn"></div>
 </div>
</div>
</div>
<script>
const N=[
 {n:'Unit 1 · What is a loop?',x:236,y:586,s:'done',i:'repeat'},
 {n:'Unit 2 · Counting',x:108,y:514,s:'done',i:'list-ordered'},
 {n:'Unit 3 · Repeat and Count',x:228,y:434,s:'now'},
 {n:'Unit 4 · Loop Patterns',x:120,y:356,s:'lock'},
 {n:'Mission unlocks',x:276,y:302,s:'mission'},
];
let h='',d='M196 700 L'+N.map(p=>p.x+' '+p.y).join(' L');
N.forEach(p=>{const big=p.s==='now';const sz=big?64:p.s==='mission'?50:52;
 const bg={done:'#63C132',now:'#7C3AED',lock:'#CBD5E1',mission:'#FFB700'}[p.s];const sh={done:'#3E8F18',now:'#5B21B6',lock:'#94A3B8',mission:'#C98F00'}[p.s];
 const inner=p.s==='lock'?'<span data-ic="lock" data-s="22"></span>':p.s==='done'?`<i data-lucide="${p.i}" style="width:22px;height:22px"></i>`:p.s==='mission'?'<i data-lucide="flag" style="width:22px;height:22px;color:#0F172A"></i>':'3';
 h+=`<div style="position:absolute;left:${p.x-sz/2}px;top:${p.y-sz/2}px;width:${sz}px;height:${sz}px;z-index:5">
  ${big?`<div style="position:absolute;inset:-10px;border-radius:999px;background:rgba(124,58,237,.28);box-shadow:0 0 0 8px rgba(124,58,237,.14)"></div>`:''}
  <div style="position:relative;width:100%;height:100%;border-radius:${p.s==='mission'?'16px':'999px'};background:${bg};box-shadow:0 5px 0 ${sh},0 10px 16px rgba(0,0,0,.3);border:4px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:24px;${p.s==='mission'?'opacity:.92':''}">${inner}</div>
  ${p.s==='mission'?'<span data-ic="lock" data-s="18" style="position:absolute;right:-6px;bottom:-4px;background:#fff;border-radius:99px;padding:2px;width:22px;height:22px"></span>':''}
  <div style="position:absolute;top:${sz+6}px;left:50%;transform:translateX(-50%);white-space:nowrap;background:${p.s==='lock'||p.s==='mission'?'rgba(241,245,249,.95)':p.s==='now'?'#7C3AED':'#fff'};color:${p.s==='lock'||p.s==='mission'?'#64748B':p.s==='now'?'#fff':'#0F172A'};font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.18)">${p.n}${p.s==='done'?' ✓':''}</div>
 </div>`});
document.getElementById('nodes').innerHTML=h;
document.getElementById('trail').innerHTML=`<path d="${d}" fill="none" stroke="rgba(15,23,42,.35)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="1 14" stroke-linecap="round"/>`;
</script>
<script>tpInit()</script></body></html>
