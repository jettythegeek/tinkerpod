<div class="capture" style="padding:30px">
<div class="phone theme-junior">
 <div class="screen">
  <div style="position:absolute;inset:0 0 auto 0;height:330px;background:radial-gradient(120% 90% at 85% 0%,#A78BFA 0%,#7C3AED 45%,#5B21B6 100%);border-radius:0 0 40px 40px"></div>
  <svg style="position:absolute;top:60px;left:0;opacity:.18" width="390" height="260"><circle cx="30" cy="40" r="3" fill="#fff"/><circle cx="350" cy="190" r="4" fill="#fff"/><path d="M190 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/><circle cx="120" cy="230" r="60" fill="none" stroke="#fff" stroke-width="2"/></svg>
  <div data-statusbar="light"></div>
  <div class="scroll" style="position:relative">
   <div class="flex items-center gap-3 mt-2">
    <img src="../assets/av-girl.png" class="avatar" style="width:52px;height:52px;box-shadow:0 0 0 3px #fff">
    <div class="flex-1 text-white">
     <div style="font-size:22px;font-weight:900;line-height:1.1">Hi, Amara!</div>
     <div style="font-weight:700;opacity:.85;font-size:14px">Ready to tinker today?</div>
    </div>
    <div style="width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;position:relative"><i data-lucide="bell"></i><span style="position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:9px;background:#FFB700;box-shadow:0 0 0 2px #7C3AED"></span></div>
   </div>
   <div class="flex gap-2 mt-4" style="position:relative;z-index:2">
    <span class="stat"><span data-ic="flame" data-s="24"></span>7-day streak</span>
    <span class="stat"><span data-ic="coin" data-s="24"></span>1,250</span>
    <span class="stat"><span data-ic="gem" data-s="22"></span>45</span>
   </div>
   <!-- level card -->
   <div class="card" style="position:relative;padding:18px;overflow:visible;margin-top:22px">
    <img src="../assets/mascot-cheering.png" style="position:absolute;right:-4px;top:-74px;width:124px;filter:drop-shadow(0 10px 12px rgba(30,0,80,.25))">
    <div class="over" style="color:var(--purple)">Level 12</div>
    <div style="font-size:24px;font-weight:900;line-height:1.1;margin-top:2px">Jango-Jango</div>
    <div class="cap" style="margin-top:2px">Next title: <b style="color:var(--ink)">Design Sultan</b></div>
    <div class="flex items-center gap-2 mt-4">
     <span data-ic="xp" data-s="26"></span>
     <div class="bar xp flex-1" style="height:16px;background:#FFF1CC"><i style="width:78%"></i></div>
    </div>
    <div class="flex justify-between mt-1.5" style="font-size:12px;font-weight:800;color:var(--muted)"><span>2,340 / 3,000 XP</span><span>660 XP to go</span></div>
   </div>
   <!-- continue -->
   <div class="card mt-4 flex items-center gap-3" style="padding:12px;background:linear-gradient(0deg,#fff,#fff)">
    <div style="width:64px;height:64px;border-radius:20px;overflow:hidden;flex:none"><img src="../assets/lesson-loops.jpg" style="width:100%;height:100%;object-fit:cover;transform:scale(1.25)"></div>
    <div class="flex-1 min-w-0">
     <div class="over" style="color:var(--teal-btn)">Continue · Loops Valley</div>
     <div class="h3">Repeat and Count</div>
     <div class="bar teal mt-1.5" style="height:8px"><i style="width:40%"></i></div>
    </div>
    <div class="btn teal" style="width:52px;height:52px;padding:0;flex:none"><i data-lucide="play" style="fill:#fff"></i></div>
   </div>
   <!-- missions -->
   <div class="flex items-end justify-between mt-6 mb-3">
    <div class="h2">Daily Missions</div>
    <div class="chip" style="height:26px;font-size:12px;color:var(--coral);box-shadow:none;background:var(--coral-soft)"><i data-lucide="clock" style="width:14px;height:14px"></i>6h 12m left</div>
   </div>
   <div class="flex flex-col gap-2.5">
    <div class="card flex items-center gap-3" style="padding:10px 14px 10px 10px">
     <div style="width:44px;height:44px;border-radius:16px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;color:var(--green-text)"><i data-lucide="book-open-check"></i></div>
     <div class="flex-1"><div style="font-weight:800;font-size:15px;text-decoration:line-through;color:var(--muted)">Finish a lesson</div><div style="font-size:12px;font-weight:800;color:var(--green-text)">Done! +50 XP</div></div>
     <span data-ic="check" data-s="28"></span>
    </div>
    <div class="card flex items-center gap-3" style="padding:10px 14px 10px 10px">
     <div style="width:44px;height:44px;border-radius:16px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;color:#B45309"><i data-lucide="puzzle"></i></div>
     <div class="flex-1"><div style="font-weight:800;font-size:15px">Solve 3 code puzzles</div><div class="flex items-center gap-2 mt-1"><div class="bar flex-1" style="height:8px;background:#FFF1CC"><i style="width:66%;background:#FFB700"></i></div><span style="font-size:12px;font-weight:900">2/3</span></div></div>
     <span class="chip" style="height:28px;font-size:12px;box-shadow:none;background:var(--purple-soft);color:var(--purple)">+30 XP</span>
    </div>
    <div class="card flex items-center gap-3" style="padding:10px 14px 10px 10px">
     <div style="width:44px;height:44px;border-radius:16px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;color:var(--blue)"><i data-lucide="timer"></i></div>
     <div class="flex-1"><div style="font-weight:800;font-size:15px">Code for 15 minutes</div><div class="flex items-center gap-2 mt-1"><div class="bar flex-1" style="height:8px;background:#DCE7FF"><i style="width:30%;background:#2563EB"></i></div><span style="font-size:12px;font-weight:900">5/15</span></div></div>
     <span class="chip" style="height:28px;font-size:12px;box-shadow:none;background:var(--yellow-soft);color:#8A5A00"><span data-ic="coin" data-s="14"></span>20</span>
    </div>
   </div>
  </div>
  <div data-nav="home"></div>
 </div>
</div>
</div>
