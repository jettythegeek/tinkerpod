<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tp.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="tp.js"></script>
</head>
<body><div class="capture" style="padding:30px">
<div class="phone theme-junior">
 <div class="screen">
  <!-- purple Learn header -->
  <div style="position:absolute;inset:0 0 auto 0;height:188px;background:radial-gradient(120% 90% at 85% 0%,#A78BFA 0%,#7C3AED 45%,#5B21B6 100%);border-radius:0 0 32px 32px;box-shadow:0 10px 24px -12px rgba(30,0,80,.5)"></div>
  <div data-statusbar="light"></div>
  <div style="position:relative;padding:2px 20px 0">
   <div class="flex items-center justify-between">
    <div class="text-white"><div class="over" style="color:#DDD6FE">Journey 1 · Explorer</div><div style="font-size:28px;font-weight:900;line-height:1.1">Learn</div></div>
    <span data-podchip="coding,design"></span>
   </div>
   <div class="seg3 mt-4"><span><i data-lucide="map"></i>Journey</span><span><i data-lucide="target"></i>Missions</span><span class="on"><i data-lucide="swords"></i>Compete</span></div>
  </div>

  <div style="position:relative;padding:30px 16px 0;display:flex;flex-direction:column;gap:10px">
   <div class="card" style="border-radius:24px;padding:4px 14px 14px;text-align:center">
    <img src="../assets/empty/static/empty-no-tournaments.png" style="width:220px;margin:0 auto">
    <div style="font-size:20px;font-weight:900;line-height:1.15;margin-top:-6px">Competitions are coming soon</div>
    <div style="font-size:13.5px;font-weight:700;color:#475569;margin-top:4px;line-height:1.4">Keep learning. The XP you earn now gets you ready for your first League week.</div>
    <div class="btn sm yellow mt-3" style="height:42px;width:100%"><i data-lucide="bell-ring" style="width:16px"></i>Tell me when it opens</div>
   </div>
   <div id="cards" class="flex flex-col gap-2"></div>
  </div>
  <div data-kidnav="learn"></div>
 </div>
</div>
</div>
<script>
const K=[['league','League','Weekly · your mentor group of 20 · move up divisions'],['cup','Cup','Knockout rounds inside Coding Pod'],['wc','World Cup','Nationwide · every pod · once a year']];
document.getElementById('cards').innerHTML=K.map(([e,n,d])=>`<div class="card flex items-center gap-3" style="padding:9px 12px 9px 10px;border-radius:20px">
<span data-emb="${e}" data-s="40" style="filter:grayscale(.35);opacity:.85"></span>
<div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span style="font-weight:900;font-size:15.5px">${n}</span><span class="st s nodot" style="height:20px;font-size:10.5px">COMING SOON</span></div><div class="cap" style="font-size:12px">${d}</div></div>
<span data-ic="lock" data-s="20"></span></div>`).join('');
</script>
<script>tpInit()</script></body></html>
