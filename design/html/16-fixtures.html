<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tp.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="tp.js"></script>
</head>
<body><div class="capture" style="padding:30px">
<div class="phone theme-junior">
 <div class="screen">
  <div style="position:absolute;inset:0 0 auto 0;height:200px;background:radial-gradient(100% 120% at 80% 0%,#3B2A99 0%,#101B4D 70%);border-radius:0 0 32px 32px"></div>
  <div data-statusbar="light"></div>
  <div style="position:relative;padding:2px 20px 0;color:#fff">
   <div class="flex items-center gap-3">
    <div style="width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center"><i data-lucide="chevron-left"></i></div>
    <div class="flex-1"><div style="font-size:21px;font-weight:900;line-height:1.1">AfriTech League</div><div style="font-size:12px;font-weight:700;opacity:.8">Season 3 · Junior Division (5–11)</div></div>
    <span data-emb="league" data-s="40"></span>
   </div>
   <div class="flex gap-2 mt-4">
    <span class="chip" style="background:rgba(255,255,255,.12);color:#fff;box-shadow:none">Table</span>
    <span class="chip" style="background:#fff;color:#101B4D;box-shadow:none">Fixtures & results</span>
    <span class="chip" style="background:rgba(255,255,255,.12);color:#fff;box-shadow:none">My matches</span>
   </div>
   <div id="weeks" class="flex gap-1.5 mt-3"></div>
  </div>
  <div style="position:relative;padding:14px 14px 0">
   <div class="flex items-center gap-2" style="font-size:12px;font-weight:800;color:#475569;background:#EAF1FF;border-radius:12px;padding:7px 10px"><i data-lucide="eye" style="width:15px;color:#2563EB"></i>Public to all · you play everyone home &amp; away</div>
   <div class="flex justify-between items-baseline mt-3"><span class="h3">Week 6 · Sat, Nov 1</span><span class="cap">Away legs: Dec 13</span></div>
   <div class="card mt-2" style="padding:4px 4px;border-radius:22px" id="w6"></div>
   <div class="flex justify-between items-baseline mt-3"><span class="h3">Week 5 · results</span><span class="cap" style="color:#7C3AED">See all 10</span></div>
   <div class="card mt-2" style="padding:4px 4px;border-radius:22px" id="w5"></div>
  </div>
  <div data-nav="league"></div>
 </div>
</div>
</div>
<script>
let w='';[3,4,5,6,7,8,9].forEach(n=>w+=`<div style="flex:1;text-align:center;border-radius:14px;padding:5px 0;${n==6?'background:#FFB700;color:#0F172A':'background:rgba(255,255,255,.1)'}"><div style="font-size:10px;font-weight:800;opacity:.8">WK</div><div style="font-weight:900;font-size:15px;line-height:1">${n}</div></div>`);
document.getElementById('weeks').innerHTML=w;
function row(h,a,s,o){const me=o&&o.me;return `<div style="display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;padding:7px 8px;border-radius:16px;${me?'background:#F3EEFF;box-shadow:inset 0 0 0 1.5px #7C3AED':''}">
<div class="flex items-center gap-2" style="min-width:0"><img src="../assets/${h[1]}.png" style="width:26px;height:26px;border-radius:99px"><span style="font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h[0]}</span></div>
<div style="text-align:center">${s?`<span style="font-weight:900;font-size:15px;background:#F1F5F9;border-radius:9px;padding:2px 8px">${s}</span>`:`<span style="font-weight:900;font-size:12px;color:${me?'#7C3AED':'#64748B'}">${o&&o.t||'4:00'}</span>`}${o&&o.leg?`<div style="font-size:9.5px;font-weight:800;color:#94A3B8;margin-top:1px">${o.leg}</div>`:''}</div>
<div class="flex items-center gap-2 justify-end" style="min-width:0"><span style="font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a[0]}</span><img src="../assets/${a[1]}.png" style="width:26px;height:26px;border-radius:99px"></div></div>`}
document.getElementById('w6').innerHTML=[
 row(['You (Amara)','av-girl'],['Chidi Builds','av3'],null,{me:1,t:'4:00 PM',leg:'LEG 1 · HOME'}),
 row(['Tobi Coder','av1'],['Zainab.js','av6'],null,{leg:'LEG 1'}),
 row(['Kemi Loops','av4'],['Ada Lovebytes','av2'],null,{t:'4:30',leg:'LEG 1'}),
 row(['Emeka Pixel','av5'],['Musa Robotix','av3'],null,{t:'5:00',leg:'LEG 1'})].join('');
document.getElementById('w5').innerHTML=[
 row(['Ngozi Dev','av2'],['You (Amara)','av-girl'],'1 – 3',{me:1,leg:'AWAY · WON'}),
 row(['Chidi Builds','av3'],['Tobi Coder','av1'],'2 – 2',{leg:'FT'}),
 row(['Zainab.js','av6'],['Halima Hacks','av6'],'4 – 1',{leg:'FT'})].join('');
</script>
<script>tpInit()</script></body></html>
