<svg xmlns="http://www.w3.org/2000/svg" id="f10-root" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Streak flame, idle loop">
<title>Streak flame, idle loop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap');
#f10-root text{font-family:Nunito,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:900}
#f10-root .f10-a{transform-box:fill-box;transform-origin:50% 50%}
@keyframes f10-k0{0.000%{transform:scale(1,1) skewX(0deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}16.667%{transform:scale(1.04,.96) skewX(2deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}33.333%{transform:scale(.97,1.05) skewX(-2deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}50.000%{transform:scale(1.03,.98) skewX(1.5deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}66.667%{transform:scale(.98,1.04) skewX(-1.5deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}83.333%{transform:scale(1.02,.99) skewX(1deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}100.000%{transform:scale(1,1) skewX(0deg)}}#f10-flick{animation:f10-k0 1.8s linear 0s infinite both}
@keyframes f10-k1{0.000%{transform:scale(1,1);animation-timing-function:cubic-bezier(.45,0,.55,1)}25.000%{transform:scale(.95,1.06);animation-timing-function:cubic-bezier(.45,0,.55,1)}50.000%{transform:scale(1.04,.96);animation-timing-function:cubic-bezier(.45,0,.55,1)}75.000%{transform:scale(.97,1.04);animation-timing-function:cubic-bezier(.45,0,.55,1)}100.000%{transform:scale(1,1)}}#f10-mid{animation:f10-k1 1.8s linear 0s infinite both}
@keyframes f10-k2{0.000%{transform:scale(1,1);animation-timing-function:cubic-bezier(.45,0,.55,1)}16.667%{transform:scale(1.06,.93);animation-timing-function:cubic-bezier(.45,0,.55,1)}33.333%{transform:scale(.95,1.07);animation-timing-function:cubic-bezier(.45,0,.55,1)}50.000%{transform:scale(1.05,.95);animation-timing-function:cubic-bezier(.45,0,.55,1)}66.667%{transform:scale(.96,1.06);animation-timing-function:cubic-bezier(.45,0,.55,1)}83.333%{transform:scale(1.04,.96);animation-timing-function:cubic-bezier(.45,0,.55,1)}100.000%{transform:scale(1,1)}}#f10-core{animation:f10-k2 1.8s linear 0s infinite both}
@keyframes f10-k3{0.000%{opacity:.75;transform:scale(1);animation-timing-function:cubic-bezier(.45,0,.55,1)}50.000%{opacity:1;transform:scale(1.07);animation-timing-function:cubic-bezier(.45,0,.55,1)}100.000%{opacity:.75;transform:scale(1)}}#f10-halo{animation:f10-k3 1.8s linear 0s infinite both}
@keyframes f10-k4{0.000%{opacity:0;transform:translateY(0px);animation-timing-function:step-end}0.000%{opacity:1;transform:translateY(0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}50.000%{opacity:0;transform:translateY(-110px);animation-timing-function:step-end}100.000%{opacity:0;transform:translateY(-110px)}}#f10-e0{animation:f10-k4 1.8s linear 0s infinite both}
@keyframes f10-k5{0.000%{opacity:0;transform:translateY(0px);animation-timing-function:step-end}25.000%{opacity:1;transform:translateY(0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}75.000%{opacity:0;transform:translateY(-110px);animation-timing-function:step-end}100.000%{opacity:0;transform:translateY(-110px)}}#f10-e1{animation:f10-k5 1.8s linear 0s infinite both}
@keyframes f10-k6{0.000%{opacity:0;transform:translateY(0px);animation-timing-function:step-end}50.000%{opacity:1;transform:translateY(0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}100.000%{opacity:0;transform:translateY(-110px);animation-timing-function:step-end}}#f10-e2{animation:f10-k6 1.8s linear 0s infinite both}
@keyframes f10-k7{0.000%{opacity:0.33;transform:translateY(-73px);animation-timing-function:cubic-bezier(.22,1,.36,1)}16.667%{opacity:0;transform:translateY(-110px);animation-timing-function:step-end}66.667%{opacity:1;transform:translateY(0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}100.000%{opacity:0.33;transform:translateY(-73px)}}#f10-e3{animation:f10-k7 1.8s linear 0s infinite both}
@keyframes f10-k8{0.000%{opacity:0.67;transform:translateY(-37px);animation-timing-function:cubic-bezier(.22,1,.36,1)}33.333%{opacity:0;transform:translateY(-110px);animation-timing-function:step-end}83.333%{opacity:1;transform:translateY(0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}100.000%{opacity:0.67;transform:translateY(-37px)}}#f10-e4{animation:f10-k8 1.8s linear 0s infinite both}
@media (prefers-reduced-motion:reduce){#f10-root *{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}#f10-embers circle{opacity:0}}
</style>
<defs>
 <linearGradient id="f10-fo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF6B6B"/><stop offset=".55" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFB700"/></linearGradient>
 <linearGradient id="f10-fm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD54A"/></linearGradient>
 <radialGradient id="f10-halo"><stop offset="0" stop-color="#FFE7A3" stop-opacity=".8"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/></radialGradient></defs>
<g transform="translate(300 300) scale(1.55) translate(-300 -170)">
 <g id="f10-halo" class="f10-a"><ellipse cx="300" cy="170" rx="130" ry="120" fill="url(#f10-halo)"/></g>
 <g id="f10-flick" class="f10-a" style="transform-origin:50% 100%">
  <path d="M300 62 C334 104 380 132 376 186 C373 228 340 252 300 252 C260 252 226 228 224 188 C222 152 244 132 258 108 C264 134 274 146 286 150 C284 118 288 90 300 62Z" fill="url(#f10-fo)"/>
  <g id="f10-mid" class="f10-a" style="transform-origin:50% 100%"><path d="M302 116 C322 142 346 160 344 194 C342 224 324 240 300 240 C276 240 258 224 258 198 C258 176 270 162 280 148 C284 166 292 174 300 176 C296 156 296 136 302 116Z" fill="url(#f10-fm)"/></g>
  <g id="f10-core" class="f10-a" style="transform-origin:50% 100%"><path d="M300 166 C314 184 324 196 322 212 C320 228 312 236 300 236 C288 236 280 228 279 214 C278 198 290 186 300 166Z" fill="#FFF1B8"/></g>
 </g>
 <g id="f10-embers"><circle id="f10-e0" cx="266" cy="120" r="6.5" fill="#FFB700" opacity="0"/><circle id="f10-e1" cx="326" cy="120" r="5.5" fill="#FFB700" opacity="0"/><circle id="f10-e2" cx="292" cy="120" r="7.5" fill="#FFB700" opacity="0"/><circle id="f10-e3" cx="338" cy="120" r="5.0" fill="#FFB700" opacity="0"/><circle id="f10-e4" cx="256" cy="120" r="5.5" fill="#FFB700" opacity="0"/></g>
</g>
</svg>