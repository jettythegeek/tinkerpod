<svg xmlns="http://www.w3.org/2000/svg" id="f12-root" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Pull to refresh">
<title>Pull to refresh</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap');
#f12-root text{font-family:Nunito,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:900}
#f12-root .f12-a{transform-box:fill-box;transform-origin:50% 50%}
@keyframes f12-k0{0.000%{transform:translateY(-120px);animation-timing-function:cubic-bezier(.45,0,.55,1)}30.769%{transform:translateY(0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}35.385%{transform:translateY(-14px);animation-timing-function:cubic-bezier(.45,0,.55,1)}38.462%{transform:translateY(0px)}84.615%{transform:translateY(0px);animation-timing-function:cubic-bezier(.55,0,.9,.4)}96.154%{transform:translateY(-140px)}100.000%{transform:translateY(-140px)}}#f12-puck{animation:f12-k0 2.6s linear 0s infinite both}
@keyframes f12-k1{0.000%{transform:rotate(-180deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}30.769%{transform:rotate(0deg);animation-timing-function:linear}73.077%{transform:rotate(720deg);animation-timing-function:step-end}100.000%{transform:rotate(720deg)}}#f12-rot{animation:f12-k1 2.6s linear 0s infinite both}
@keyframes f12-k2{0.000%{opacity:1;transform:scale(1)}71.154%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(.55,0,.9,.4)}75.000%{opacity:0;transform:scale(.4);animation-timing-function:step-end}100.000%{opacity:0;transform:scale(.4)}}#f12-arrow{animation:f12-k2 2.6s linear 0s infinite both}
@keyframes f12-k3{0.000%{opacity:0;transform:scale(0);animation-timing-function:step-end}73.846%{opacity:1;transform:scale(0);animation-timing-function:cubic-bezier(.34,1.6,.64,1)}82.692%{opacity:1;transform:scale(1)}100.000%{opacity:1;transform:scale(1)}}#f12-check{animation:f12-k3 2.6s linear 0s infinite both}
@keyframes f12-k4{0.000%{fill:#fff}73.077%{fill:#fff;animation-timing-function:cubic-bezier(.22,1,.36,1)}76.923%{fill:#63C132}100.000%{fill:#63C132}}#f12-disc{animation:f12-k4 2.6s linear 0s infinite both}
@keyframes f12-k5{0.000%{transform:scaleY(0);animation-timing-function:cubic-bezier(.45,0,.55,1)}30.769%{transform:scaleY(1);animation-timing-function:cubic-bezier(.22,1,.36,1)}36.538%{transform:scaleY(0)}100.000%{transform:scaleY(0)}}#f12-stretch{animation:f12-k5 2.6s linear 0s infinite both}
@keyframes f12-k6{0.000%{transform:translateY(0px);animation-timing-function:cubic-bezier(.45,0,.55,1)}30.769%{transform:translateY(110px);animation-timing-function:cubic-bezier(.22,1,.36,1)}37.692%{transform:translateY(84px);animation-timing-function:cubic-bezier(.45,0,.55,1)}84.615%{transform:translateY(84px);animation-timing-function:cubic-bezier(.55,0,.9,.4)}96.154%{transform:translateY(0px)}100.000%{transform:translateY(0px)}}#f12-list{animation:f12-k6 2.6s linear 0s infinite both}
@keyframes f12-k7{0.000%{opacity:0;animation-timing-function:step-end}75.000%{opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1)}86.538%{opacity:0}100.000%{opacity:0}}#f12-t{animation:f12-k7 2.6s linear 0s infinite both}
@media (prefers-reduced-motion:reduce){#f12-root *{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
<g id="f12-list"><rect x="70" y="155" width="460" height="96" rx="24" fill="#0F172A" opacity=".07"/><rect x="70" y="150" width="460" height="96" rx="24" fill="#fff"/><circle cx="122" cy="198" r="26" fill="#E6F9F7"/><rect x="166" y="180" width="230" height="16" rx="8" fill="#E2E8F0"/><rect x="166" y="206" width="150" height="12" rx="6" fill="#EEF1F5"/><rect x="70" y="275" width="460" height="96" rx="24" fill="#0F172A" opacity=".07"/><rect x="70" y="270" width="460" height="96" rx="24" fill="#fff"/><circle cx="122" cy="318" r="26" fill="#EDE7FB"/><rect x="166" y="300" width="190" height="16" rx="8" fill="#E2E8F0"/><rect x="166" y="326" width="210" height="12" rx="6" fill="#EEF1F5"/><rect x="70" y="395" width="460" height="96" rx="24" fill="#0F172A" opacity=".07"/><rect x="70" y="390" width="460" height="96" rx="24" fill="#fff"/><circle cx="122" cy="438" r="26" fill="#FFF6DB"/><rect x="166" y="420" width="250" height="16" rx="8" fill="#E2E8F0"/><rect x="166" y="446" width="120" height="12" rx="6" fill="#EEF1F5"/></g>
<g transform="translate(300 40)"><g id="f12-stretch" class="f12-a" style="transform-origin:50% 0%"><rect x="-4" y="0" width="8" height="40" rx="4" fill="#CBD5E1"/></g></g>
<g id="f12-puck"><g transform="translate(300 100)">
 <circle r="44" cy="4" fill="#0F172A" opacity=".08"/><circle id="f12-disc" r="44" fill="#fff" stroke="#E2E8F0" stroke-width="3"/>
 <g id="f12-rot" class="f12-a"><g id="f12-arrow" class="f12-a"><path d="M4 -24 A24 24 0 1 1 -20.8 -12" fill="none" stroke="#007A70" stroke-width="8" stroke-linecap="round"/><path d="M-2 -35 L12 -24 L-2 -13Z" fill="#007A70" stroke="#007A70" stroke-width="4" stroke-linejoin="round"/></g></g>
 <g id="f12-check" class="f12-a" opacity="0"><path d="M-17 1 L-5 13 L18 -12" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
</g></g>
<g id="f12-t" opacity="0"><text x="300" y="186" font-size="22" fill="#2F7D16" text-anchor="middle" >Up to date</text></g>
</svg>