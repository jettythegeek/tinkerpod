<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Progress ring">
<title>Progress ring</title>

<g transform="translate(300 280)">
 
 <circle r="150" fill="none" stroke="#E6F9F7" stroke-width="30"></circle>
 <g transform="matrix(0 -1 1 0 0 0)"><circle id="f14-prog" r="150" fill="none" stroke="#00BFAE" stroke-width="30" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="25"></circle></g>
 <g id="f14-cap" transform="matrix(0 -1 1 0 0 0)"><circle cx="0" cy="-150" r="9" fill="#fff"></circle></g>
</g>
<g id="f14-num"><g id="f14-n15"><text x="300" y="300" font-size="76" fill="#0F172A" text-anchor="middle" font-family="Nunito" font-weight="900">75%</text></g></g>
<text x="300" y="342" font-size="24" fill="#64748B" text-anchor="middle" font-family="Nunito" font-weight="900">of today’s goal</text>

</svg>
